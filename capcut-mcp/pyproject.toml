[project]
name = "capcut-mcp"
version = "0.1.0"
description = "MCP server that prepares captions, scripts and shot lists to import into CapCut"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
capcut-mcp = "capcut_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["capcut_mcp"]
